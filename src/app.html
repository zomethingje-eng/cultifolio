<!doctype html>
<html lang="en" %sveltekit.theme%>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cultifolio" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
  <script>try{var t=localStorage.getItem('cultifolio.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
