<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cultifolio" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
  <!-- The example's flag is taken off here when the address says the tab left it (`?left=sample`) or the tab was sent home
       because another tab closed it (`cultifolio.sampleClosed`). Leave marks the example for deletion in the tab's storage;
       the address marks it too, but only in a tab Leave itself marked as out (`cultifolio.sampleOut`), since the storage
       mark could be lost to a Leave's own timers (r62g 8, one run in six at the merge). A copied link or a bookmark opened
       in another tab deletes nothing, and no delete runs while any tab holds the example open (round sixty-seven; V3, V6). -->
  <script>try{var t=localStorage.getItem('cultifolio.theme'),d=document.documentElement.dataset;if(t==='light'||t==='dark')d.theme=t;if(localStorage.getItem('cultifolio.welcomed')==='1')d.welcomed='1';if(localStorage.getItem('cultifolio.hasMine')==='1')d.grower='1';if(/[?&]left=sample(&|$)/.test(location.search)&&sessionStorage.getItem('cultifolio.sampleOut')==='1')sessionStorage.setItem('cultifolio.sampleLeft','1');if(/[?&]left=sample(&|$)/.test(location.search)||sessionStorage.getItem('cultifolio.sampleClosed')==='1'){sessionStorage.removeItem('cultifolio.demo');sessionStorage.setItem('cultifolio.sampleOut','1')}if(sessionStorage.getItem('cultifolio.demo')==='1'){d.demo='1';d.grower='1'}}catch(e){}</script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
  <!-- A page about your own plants is drawn only on the device, so its HTML had nothing in it and the screen stayed
       blank until the scripts ran: 4.5 s on a slow phone. This placeholder shows the bar and a line meanwhile, and only
       on such a page: a page the server drew has its content in the box above, and the rule below keeps the line hidden;
       so does a browser without :has(). The app removes it once it draws (round sixty; the accessibility review, 7).
       No script: the page's policy allows only hashed inline scripts, and a style needs none. -->
  <style>#shell{display:none}body>div:first-child:not(:has(>:not(script)))+#shell{display:block}</style>
  <div id="shell" style="font-family: var(--ui, system-ui, sans-serif); color: var(--ink, #1b2421)">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 2px 16px; margin: 0 -16px; border-bottom: 1px solid var(--rule, #dde3e0); background: var(--bg, #f3f5f4)"><span aria-hidden="true" style="color: var(--accent, #1f6b4f); font-weight: 600; min-width: 44px; text-align: center">✳</span><span style="font-size: 0.6875rem; letter-spacing: 0.11em; text-transform: uppercase; font-weight: 600; color: var(--ink3, #5b6662)">Cultifolio</span></div>
    <p style="max-width: 980px; margin: 24px auto; color: var(--ink3, #5b6662)">Opening your plants…</p>
  </div>
</body>
</html>
